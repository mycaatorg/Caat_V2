name: Nightly E2E (full suite)

# The FULL legacy Playwright suite (resume editor + community flows) writes
# synthetic data only to a disposable local Supabase stack on this runner.
#
# Keep manual-only until the broad legacy suite is stable enough for scheduled
# runs. Each dispatch starts from a fresh local database and has no production
# database credentials.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * *"  # 07:00 UTC nightly — enable only after step 1-2 above

permissions:
  contents: read

jobs:
  full-e2e:
    name: Full E2E (isolated local Supabase)
    # Keep browser dependencies on an OS supported by locked Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: caat-frontend
    env:
      CAAT_ISOLATED_E2E: '1'
      E2E_TEST_EMAIL: e2e.student@caat.local.test
      E2E_TEST_PASSWORD: Caat-ci-e2e-local-only-2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            caat-frontend/package-lock.json
            caat-frontend/pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.90.0

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Ensure PostgreSQL client for isolated bootstrap
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start isolated local Supabase
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/caat-supabase/supabase"
          cp caat-frontend/tests/staging/config.toml "$RUNNER_TEMP/caat-supabase/supabase/config.toml"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 caat-supabase
          supabase --network-id caat-supabase --workdir "$RUNNER_TEMP/caat-supabase" start --exclude realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase --workdir "$RUNNER_TEMP/caat-supabase" status --output env > "$RUNNER_TEMP/caat-supabase-status.env"
          node .github/scripts/bootstrap-local-supabase.mjs "$RUNNER_TEMP/caat-supabase-status.env"

      - name: Full E2E suite (single production build + server)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: caat-frontend/playwright-report
          retention-days: 14
