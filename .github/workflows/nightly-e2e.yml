name: Nightly E2E (full suite)

# The FULL Playwright suite (resume editor + community flows). Unlike the
# read-only PR smoke, these tests CREATE data (posts, comments, etc.), so they
# should run against a DEDICATED TEST Supabase project — not production.
#
# Before enabling the nightly schedule:
#   1. Create a separate Supabase project for testing (run the same migrations).
#   2. Add repo secrets pointing at it:
#        E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY  (a test project, NOT prod)
#        E2E_TEST_EMAIL, E2E_TEST_PASSWORD        (a seeded test account there)
#   3. Uncomment the `schedule` block below.
#
# Until then this workflow is manual-only (workflow_dispatch) so it never
# writes test data into the production database on a timer.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * *"  # 07:00 UTC nightly — enable only after step 1-2 above

jobs:
  full-e2e:
    name: Full E2E (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caat-frontend
    env:
      # Full E2E writes test data, so use only the dedicated test project.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            caat-frontend/package-lock.json
            caat-frontend/pnpm-lock.yaml

      - name: Require isolated E2E database and account
        run: node .github/scripts/assert-e2e-isolation.js
        working-directory: .

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Full E2E suite (Playwright builds + starts the prod server)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: caat-frontend/playwright-report
          retention-days: 14
