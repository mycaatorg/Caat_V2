name: CI

on:
  # Run CI for all changes targeting the main integration branches.
  push:
    branches:
      - develop
      - main # Safe even if the branch does not exist yet.
  pull_request:
    branches:
      - develop
      - main

jobs:
  discover-projects:
    name: Discover JavaScript/TypeScript projects
    runs-on: ubuntu-latest
    outputs:
      project_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node is required here only to run the discovery script.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test project discovery contract
        run: node --test .github/scripts/*.test.js

      - name: Discover subprojects for CI
        # This script scans the repo for package.json files (excluding build artifacts)
        # and emits a matrix object describing each project and which npm scripts it supports.
        id: set-matrix
        run: |
          node .github/scripts/discover-projects.js > projects.json
          echo "matrix=$(cat projects.json)" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: discover-projects
    runs-on: ubuntu-latest
    # Blocking (G5): the pre-existing "unused eslint-disable" backlog was cleared
    # in Phase 6, so lint failures now fail the PR instead of just showing red.
    strategy:
      # Run lint for every discovered project, but keep it as a separate job so
      # it can be marked as a required check in branch protection rules.
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.project_matrix).include }}

    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project.path }}/package-lock.json
            ${{ matrix.project.path }}/pnpm-lock.yaml
            ${{ matrix.project.path }}/yarn.lock

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Lint
        # Separate job keeps the lint result visible as its own check.
        if: ${{ matrix.project.scripts.lint }}
        run: npm run lint

  ci:
    name: Project CI
    needs: discover-projects
    runs-on: ubuntu-latest
    env:
      # Supabase environment variables required at build time. Store these as
      # GitHub Actions secrets in your repository settings:
      #   - NEXT_PUBLIC_SUPABASE_URL
      #   - NEXT_PUBLIC_SUPABASE_ANON_KEY
      #
      # They are injected here so that Next.js can read them during `next build`.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    strategy:
      # Allow one project to continue even if another fails, while still failing
      # the overall workflow at the end if any project is red.
      fail-fast: false
      matrix:
        # The discovery job returns a JSON object with an "include" array.
        project: ${{ fromJSON(needs.discover-projects.outputs.project_matrix).include }}

    # Use each discovered project directory as the default working directory
    # so that scripts like "npm run lint" are scoped correctly.
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Uses a single Node.js version for now; this can be extended to a matrix
        # over Node versions if you later need multi-version testing.
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Enable built-in dependency caching for faster, more scalable CI.
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project.path }}/package-lock.json
            ${{ matrix.project.path }}/pnpm-lock.yaml
            ${{ matrix.project.path }}/yarn.lock

      - name: Install dependencies
        # Prefer deterministic installs (npm ci / pnpm / yarn) when a lockfile exists.
        # Fall back to npm install only when no lockfile is available yet.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Typecheck
        # Only run type checking when a dedicated "typecheck" script exists.
        # For the Next.js apps in this repo, this will use "tsc --noEmit".
        if: ${{ matrix.project.scripts.typecheck }}
        run: npm run typecheck

      - name: Unit tests with scoped coverage
        # Run the suite once, with coverage when this project supports it.
        if: ${{ matrix.project.scripts['test:coverage'] }}
        run: npm run test:coverage

      - name: Unit tests
        # Projects without coverage support still run their normal test command.
        if: ${{ !matrix.project.scripts['test:coverage'] && matrix.project.scripts.test }}
        run: npm test

      - name: Upload scoped coverage report
        if: ${{ always() && matrix.project.scripts['test:coverage'] }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ strategy.job-index }}
          path: ${{ matrix.project.path }}/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests (test:unit fallback)
        if: ${{ !matrix.project.scripts['test:coverage'] && !matrix.project.scripts.test && matrix.project.scripts['test:unit'] }}
        run: npm run test:unit

      - name: Build
        # Build only when a "build" script exists (e.g. Next.js "next build").
        # This will run `next build` with Supabase environment variables provided
        # via GitHub Actions secrets configured in the repository settings.
        if: ${{ matrix.project.scripts.build }}
        run: npm run build

  e2e-smoke:
    name: E2E runtime smoke (production build)
    needs: discover-projects
    runs-on: ubuntu-latest
    # Runs on every PR into develop/main (G1). It is read-only, so it is safe on
    # the shared Supabase. It needs a working login: set the repo SECRETS
    # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, E2E_TEST_EMAIL,
    # E2E_TEST_PASSWORD (Settings > Secrets and variables > Actions). The auth
    # setup FAILS LOUDLY (does not silently skip) if the login does not succeed,
    # so a missing/wrong credential surfaces as a red check rather than a false
    # green. The E2E_TEST_* fallbacks below let a fork run it against a locally
    # seeded account; in this repo the CI secrets should be set.
    # Read-only: loads every critical authenticated route against a real
    # production build and asserts no 5xx. This is the cheap check that catches
    # "build passed but the deployed app 500s" regressions (e.g. the
    # /communities serverless crash). It creates no data, so it is safe to run
    # against the shared Supabase.
    defaults:
      run:
        working-directory: caat-frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Fall back to the seeded test account if the secrets are unset. If neither
      # the secret nor the fallback can log in, auth.setup.ts fails the job.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            caat-frontend/package-lock.json
            caat-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Runtime smoke (Playwright builds + starts the prod server)
        run: npm run test:e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: caat-frontend/playwright-report
          retention-days: 7

  e2e-public:
    name: E2E public pages (production build)
    runs-on: ubuntu-latest
    # This suite has no auth setup dependency and submits no forms. It reads
    # only public catalog data; the redirect assertion does not sign in.
    defaults:
      run:
        working-directory: caat-frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: caat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Public browser smoke (Playwright builds + starts the prod server)
        run: npm run test:e2e:public

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-report
          path: caat-frontend/playwright-report
          retention-days: 7
