name: CI

on:
  # Run CI for all changes targeting the main integration branches.
  push:
    branches:
      - develop
      - main # Safe even if the branch does not exist yet.
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover-projects:
    name: Discover JavaScript/TypeScript projects
    runs-on: ubuntu-latest
    outputs:
      project_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node is required here only to run the discovery script.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test project discovery contract
        run: node --test .github/scripts/*.test.js

      - name: Discover subprojects for CI
        # This script scans the repo for package.json files (excluding build artifacts)
        # and emits a matrix object describing each project and which npm scripts it supports.
        id: set-matrix
        run: |
          node .github/scripts/discover-projects.js > projects.json
          echo "matrix=$(cat projects.json)" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: discover-projects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking (G5): the pre-existing "unused eslint-disable" backlog was cleared
    # in Phase 6, so lint failures now fail the PR instead of just showing red.
    strategy:
      # Run lint for every discovered project, but keep it as a separate job so
      # it can be marked as a required check in branch protection rules.
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.project_matrix).include }}

    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project.path }}/package-lock.json
            ${{ matrix.project.path }}/pnpm-lock.yaml
            ${{ matrix.project.path }}/yarn.lock

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Lint
        # Separate job keeps the lint result visible as its own check.
        if: ${{ matrix.project.scripts.lint }}
        run: npm run lint

  ci:
    name: Project CI
    needs: discover-projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Allow one project to continue even if another fails, while still failing
      # the overall workflow at the end if any project is red.
      fail-fast: false
      matrix:
        # The discovery job returns a JSON object with an "include" array.
        project: ${{ fromJSON(needs.discover-projects.outputs.project_matrix).include }}

    # Use each discovered project directory as the default working directory
    # so that scripts like "npm run lint" are scoped correctly.
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Uses a single Node.js version for now; this can be extended to a matrix
        # over Node versions if you later need multi-version testing.
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Enable built-in dependency caching for faster, more scalable CI.
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project.path }}/package-lock.json
            ${{ matrix.project.path }}/pnpm-lock.yaml
            ${{ matrix.project.path }}/yarn.lock

      - name: Install dependencies
        # Prefer deterministic installs (npm ci / pnpm / yarn) when a lockfile exists.
        # Fall back to npm install only when no lockfile is available yet.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Typecheck
        # Only run type checking when a dedicated "typecheck" script exists.
        # For the Next.js apps in this repo, this will use "tsc --noEmit".
        if: ${{ matrix.project.scripts.typecheck }}
        run: npm run typecheck

      - name: Unit tests with whole-source coverage
        # Run the suite once, with coverage when this project supports it.
        if: ${{ matrix.project.scripts['test:coverage'] }}
        run: npm run test:coverage

      - name: Unit tests
        # Projects without coverage support still run their normal test command.
        if: ${{ !matrix.project.scripts['test:coverage'] && matrix.project.scripts.test }}
        run: npm test

      - name: Upload whole-source coverage report
        if: ${{ always() && matrix.project.scripts['test:coverage'] }}
        uses: actions/upload-artifact@v4
        with:
          name: whole-source-coverage-${{ strategy.job-index }}
          path: ${{ matrix.project.path }}/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests (test:unit fallback)
        if: ${{ !matrix.project.scripts['test:coverage'] && !matrix.project.scripts.test && matrix.project.scripts['test:unit'] }}
        run: npm run test:unit

      - name: Build
        # Build only when a "build" script exists (e.g. Next.js "next build").
        # The CAAT browser job owns the single production build, using its
        # disposable loopback Supabase instance; skip a duplicate frontend build.
        if: ${{ matrix.project.scripts.build && matrix.project.path != 'caat-frontend' }}
        run: npm run build

  e2e-smoke:
    name: E2E browser journeys (isolated Supabase)
    needs: discover-projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every browser test, including authenticated writes, uses a disposable
    # loopback-only Supabase stack built from synthetic schema/data. No
    # production database credentials enter this job.
    defaults:
      run:
        working-directory: caat-frontend
    env:
      CAAT_ISOLATED_E2E: '1'
      E2E_TEST_EMAIL: e2e.student@caat.local.test
      # Ephemeral, local-only account value for this disposable runner stack.
      E2E_TEST_PASSWORD: Caat-ci-e2e-local-only-2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            caat-frontend/package-lock.json
            caat-frontend/pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.90.0

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Verify isolated bootstrap safety contracts
        working-directory: .
        run: node --test .github/scripts/*.test.js caat-frontend/tests/staging/safety.test.mjs

      - name: Ensure PostgreSQL client for isolated bootstrap
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start isolated local Supabase
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/caat-supabase/supabase"
          cp caat-frontend/tests/staging/config.toml "$RUNNER_TEMP/caat-supabase/supabase/config.toml"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 caat-supabase
          supabase --network-id caat-supabase --workdir "$RUNNER_TEMP/caat-supabase" start --exclude realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase --workdir "$RUNNER_TEMP/caat-supabase" status --output env > "$RUNNER_TEMP/caat-supabase-status.env"
          node .github/scripts/bootstrap-local-supabase.mjs "$RUNNER_TEMP/caat-supabase-status.env"

      - name: Production browser journeys (one build + server)
        run: npm run test:e2e:ci

      - name: Publish write-journey coverage boundary
        if: always()
        working-directory: .
        run: node .github/scripts/report-write-e2e-boundary.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: caat-frontend/playwright-report
          retention-days: 7
