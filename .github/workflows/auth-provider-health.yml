name: Production auth-provider health

on:
  workflow_dispatch:
  schedule:
    # Genuine provider readiness monitoring; not a free-tier retention workaround.
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: production-auth-provider-health
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'mycaatorg/Caat_V2'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify deployed auth-provider readiness
        env:
          AUTH_HEALTH_CHECK_TOKEN: ${{ secrets.AUTH_HEALTH_CHECK_TOKEN }}
        run: node .github/scripts/auth-health-check.js
